<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="900" fill="#ffffff"/>

  <text x="60" y="50" font-size="26" font-weight="600" fill="#161616">Concepto y desarrollo — TeoDoc</text>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Paso 1: idea -->
  <g transform="translate(60,100)">
    <rect width="340" height="330" fill="#f4f4f4" rx="4"/>
    <text x="20" y="34" font-size="14" font-weight="600" fill="#0f62fe">01 — LA IDEA</text>
    <text x="20" y="66"  font-size="13" fill="#393939">TeoDoc convierte audio</text>
    <text x="20" y="86"  font-size="13" fill="#393939">(prédicas) en texto de</text>
    <text x="20" y="106" font-size="13" fill="#393939">estudio estructurado.</text>
    <text x="20" y="136" font-size="13" fill="#393939">El símbolo debía mostrar</text>
    <text x="20" y="156" font-size="13" fill="#393939">esa transformación, no</text>
    <text x="20" y="176" font-size="13" fill="#393939">solo un ícono religioso</text>
    <text x="20" y="196" font-size="13" fill="#393939">genérico (cruz, paloma).</text>

    <g transform="translate(170,270)">
      <rect x="-50" y="-35" width="100" height="70" fill="#ffffff" stroke="#161616" stroke-width="3"/>
      <circle cx="-50" cy="0" r="10" fill="none" stroke="#161616" stroke-width="3"/>
      <circle cx="50"  cy="0" r="10" fill="none" stroke="#161616" stroke-width="3"/>
    </g>
  </g>

  <!-- Paso 2: el rollo -->
  <g transform="translate(430,100)">
    <rect width="340" height="330" fill="#f4f4f4" rx="4"/>
    <text x="20" y="34" font-size="14" font-weight="600" fill="#0f62fe">02 — EL PERGAMINO</text>
    <text x="20" y="66"  font-size="13" fill="#393939">El rollo/pergamino es</text>
    <text x="20" y="86"  font-size="13" fill="#393939">reconocible como "texto</text>
    <text x="20" y="106" font-size="13" fill="#393939">sagrado de estudio" sin</text>
    <text x="20" y="126" font-size="13" fill="#393939">recurrir a símbolos</text>
    <text x="20" y="146" font-size="13" fill="#393939">confesionales específicos.</text>
    <text x="20" y="176" font-size="13" fill="#393939">Sus bordes rectos encajan</text>
    <text x="20" y="196" font-size="13" fill="#393939">con la retícula de Carbon.</text>

    <g transform="translate(170,270)">
      <rect x="-50" y="-35" width="100" height="70" fill="#ffffff" stroke="#0f62fe" stroke-width="3"/>
      <circle cx="-50" cy="0" r="10" fill="none" stroke="#0f62fe" stroke-width="3"/>
      <circle cx="50"  cy="0" r="10" fill="none" stroke="#0f62fe" stroke-width="3"/>
      <rect x="-38" y="-18" width="50" height="5" fill="#0f62fe"/>
      <rect x="-38" y="-4"  width="50" height="5" fill="#0f62fe"/>
      <rect x="-38" y="10"  width="30" height="5" fill="#0f62fe"/>
    </g>
  </g>

  <!-- Paso 3: la onda -->
  <g transform="translate(800,100)">
    <rect width="340" height="330" fill="#f4f4f4" rx="4"/>
    <text x="20" y="34" font-size="14" font-weight="600" fill="#0f62fe">03 — LA IA / EL AUDIO</text>
    <text x="20" y="66"  font-size="13" fill="#393939">Las barras de audio al</text>
    <text x="20" y="86"  font-size="13" fill="#393939">final del texto muestran</text>
    <text x="20" y="106" font-size="13" fill="#393939">de dónde viene el</text>
    <text x="20" y="126" font-size="13" fill="#393939">contenido: la voz.</text>
    <text x="20" y="156" font-size="13" fill="#393939">Es el único elemento que</text>
    <text x="20" y="176" font-size="13" fill="#393939">habla de "tecnología",</text>
    <text x="20" y="196" font-size="13" fill="#393939">balanceando lo antiguo</text>
    <text x="20" y="216" font-size="13" fill="#393939">con lo digital.</text>

    <g transform="translate(170,270)">
      <rect x="-50" y="-35" width="100" height="70" fill="#ffffff" stroke="#0f62fe" stroke-width="3"/>
      <circle cx="-50" cy="0" r="10" fill="none" stroke="#0f62fe" stroke-width="3"/>
      <circle cx="50"  cy="0" r="10" fill="none" stroke="#0f62fe" stroke-width="3"/>
      <rect x="-38" y="-18" width="50" height="5" fill="#0f62fe"/>
      <rect x="-38" y="-4"  width="50" height="5" fill="#0f62fe"/>
      <rect x="-38" y="10"  width="30" height="5" fill="#0f62fe"/>
      <rect x="18" y="-20" width="4" height="10" fill="#0f62fe"/>
      <rect x="26" y="-24" width="4" height="18" fill="#0f62fe"/>
      <rect x="34" y="-16" width="4" height="10" fill="#0f62fe"/>
    </g>
  </g>

  <!-- Por que funciona -->
  <g transform="translate(60,460)">
    <rect width="1080" height="380" fill="#edf5ff" rx="4"/>
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f62fe">¿Por qué este concepto y no otro?</text>

    <text x="24" y="72"  font-size="13" fill="#161616" font-weight="600">1. Es específico de TeoDoc, no genérico.</text>
    <text x="24" y="94"  font-size="13" fill="#393939">Una cruz o una paloma sola funcionaría para cualquier app cristiana. El rollo con</text>
    <text x="24" y="114" font-size="13" fill="#393939">onda de audio solo tiene sentido para una herramienta que transcribe y analiza.</text>

    <text x="24" y="150" font-size="13" fill="#161616" font-weight="600">2. Se lee en cualquier tamaño.</text>
    <text x="24" y="172" font-size="13" fill="#393939">La silueta rectangular del pergamino se simplifica bien a 32px (favicon) sin perder</text>
    <text x="24" y="192" font-size="13" fill="#393939">reconocibilidad, algo que la paloma o la llama (más orgánicas) pierden a ese tamaño.</text>

    <text x="24" y="228" font-size="13" fill="#161616" font-weight="600">3. Encaja con Carbon Design System.</text>
    <text x="24" y="250" font-size="13" fill="#393939">Formas planas, ángulos rectos, un solo azul de acento (#0f62fe) y sin decoración —</text>
    <text x="24" y="270" font-size="13" fill="#393939">mismo lenguaje visual que usarás en la interfaz de la app.</text>

    <text x="24" y="306" font-size="13" fill="#161616" font-weight="600">4. Es neutral en denominación.</text>
    <text x="24" y="328" font-size="13" fill="#393939">No usa una cruz específica ni un ícono ligado a una tradición particular, por lo que</text>
    <text x="24" y="348" font-size="13" fill="#393939">sirve para un público ministerial amplio.</text>
  </g>
</svg>
